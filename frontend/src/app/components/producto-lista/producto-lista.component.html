<div class="container">
  <div class="header">
    <h2>Gestión de Productos</h2>
    <button mat-raised-button color="primary" (click)="nuevoProducto()">
      <mat-icon>add</mat-icon>
      Nuevo Producto
    </button>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="productos" class="mat-elevation-z8">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let producto">{{producto.id}}</td>
      </ng-container>

      <!-- Nombre Column -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let producto">{{producto.nombre}}</td>
      </ng-container>

      <!-- Descripción Column -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let producto">{{producto.descripcion}}</td>
      </ng-container>

      <!-- Precio Column -->
      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let producto">{{producto.precio | currency:'USD':'symbol':'1.2-2'}}</td>
      </ng-container>

      <!-- Estado Column -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let producto">
          <span class="estado-badge" [class.activo]="producto.estado" [class.inactivo]="!producto.estado">
            {{producto.estado ? 'Activo' : 'Inactivo'}}
          </span>
        </td>
      </ng-container>

      <!-- Acciones Column -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let producto">
          <button mat-icon-button color="primary" (click)="editarProducto(producto.id!)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminarProducto(producto.id!)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="productos.length === 0" class="no-data">
      <mat-icon>inbox</mat-icon>
      <p>No hay productos disponibles</p>
    </div>
  </div>
</div>
